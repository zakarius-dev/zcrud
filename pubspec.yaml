# Root du workspace zcrud (pub workspaces — resolution: workspace).
# Source de vérité de la résolution partagée : un unique pubspec.lock racine.
# Les 17 packages PRODUIT sont listés ci-dessous (ordre = Structural Seed AD-1 ;
# `zcrud_study_kernel` ajouté en ES-1.1, `zcrud_document` en ES-2.1,
# `zcrud_note` en ES-2.2), suivis des
# harnais dev/test-only `binding_conformance` (E2-9) et `reserved_keys_gate`
# (ES-1.4), hors packages/**.
#
# ⚠️ `melos.yaml` n'énumère AUCUN package (glob `packages/**`) : CE BLOC
# `workspace:` est le SEUL point de déclaration d'un nouveau package produit —
# `melos list` le prend automatiquement.
name: zcrud_workspace
publish_to: none

environment:
  sdk: ^3.12.2

# Bloc workspace natif de pub (Dart >= 3.5) : chaque membre déclare
# `resolution: workspace` dans son propre pubspec.yaml.
workspace:
  - packages/zcrud_core
  - packages/zcrud_annotations
  # ES-1.1 : noyau d'étude bas-niveau (dossier + config de session remontés
  # depuis zcrud_flashcard). Dépend uniquement de zcrud_core + zcrud_annotations
  # (acyclique flashcard -> study_kernel -> core).
  - packages/zcrud_study_kernel
  # ES-2.1 : document d'étude (contenu PARTAGEABLE) + état de lecture PERSONNEL
  # (AD-26, jamais colocalisés). Dépend de zcrud_core + zcrud_study_kernel +
  # zcrud_annotations (acyclique document -> study_kernel -> core ; CORE OUT=0).
  - packages/zcrud_document
  # ES-2.2 : note intelligente à CONTENU TYPÉ (`ZSmartNote` : ops Delta neutres,
  # jamais une `String` ambiguë — AD-28). Dépend UNIQUEMENT de zcrud_core +
  # zcrud_annotations (PUR-DART : ni zcrud_markdown — qui est Flutter/Quill (D4) —
  # ni zcrud_study_kernel — aucun import réel (D7)). ACYCLIQUE ; CORE OUT=0.
  - packages/zcrud_note
  # ES-2.6 : examen daté + rappels (`ZExam` : `ZEntity` + `ZExtensible`,
  # `@ZcrudModel`) + `ZReminderTime` (VO `HH:mm`). Proximité PURE, horloge `now`
  # INJECTÉE en paramètre (jamais `DateTime.now()`). Dépend UNIQUEMENT de
  # zcrud_core + zcrud_annotations (PUR-DART, aucun import kernel — folderId est
  # une clé NEUTRE). ACYCLIQUE ; CORE OUT=0 ; aucune arête entrante (NFR-S10).
  - packages/zcrud_exam
  # CHAT-0r : noyau de conversation IA (`ZChatConversation`/`ZChatMessage`/
  # `ZContentBlock` + contrat d'ACTION de message), RELOCALISÉ hors de
  # `zcrud_core` — 30 packages sur 31 dépendent du cœur et en portaient les 3863
  # lignes sans usage (DODLP, DLCFTI). Aligne le chat sur le patron du dépôt :
  # aucun domaine MÉTIER dans le cœur. Dépend UNIQUEMENT de zcrud_core (PUR-DART,
  # aucun codegen : sérialisation écrite à la main). ACYCLIQUE ; CORE OUT=0 ;
  # aucune arête entrante (PUITS du graphe).
  - packages/zcrud_chat_kernel
  # CHAT-2 : contrôleur de conversation `ZChatController` (ChangeNotifier +
  # tranches ValueListenable granulaires, un jeton PAR requête, reprise sans
  # rejeu, UN SEUL point d'entrée pour tous les verbes). Ce que `zcrud_study`
  # est à `zcrud_study_kernel`, `zcrud_chat` l'est à `zcrud_chat_kernel` : le
  # kernel reste PUR-DART (un ChangeNotifier vient de `flutter/foundation`).
  # Dépend UNIQUEMENT de zcrud_core + zcrud_chat_kernel (arêtes SORTANTES
  # seules) ; ACYCLIQUE ; CORE OUT=0 ; aucune dépendance TIERCE. Package
  # Flutter → `flutter test`.
  - packages/zcrud_chat
  # CHAT-6 : satellite d'ADAPTATION du chat (AD-57). Porte la SEULE arête
  # `syncfusion_flutter_chat` du graphe (coquille `SfAIAssistView`, que le port
  # `ZChatRenderer` — un rendu de BLOC — ne peut pas exprimer) ET la
  # normalisation du flux TEXTUEL d'IFFD (`###LINE###`, sentinelles pseudo-XML,
  # erreurs en clair dans le canal de réponse) vers les événements TYPÉS du
  # kernel. Ces compensations restent HORS du socle : DODLP et DLCFTI ne les
  # portent pas. Arêtes SORTANTES : zcrud_chat + zcrud_chat_kernel + zcrud_core.
  # ACYCLIQUE ; CORE OUT=0 ; PUITS du graphe (aucune arête entrante).
  - packages/zcrud_chat_syncfusion
  # CHAT-8 : PONT conversation → SRS. Mapper (message/conversation →
  # `ZFlashcardGenerationRequest` + provenance `ZConversationSource`), câblage du
  # `ZFlashcardGenerationPort` EXISTANT (qui n'avait aucun consommateur) et
  # constitution du pool de session (cartes du dossier ∪ cartes de la
  # conversation, DÉDOUBLONNÉES — IFFD n'en dédoublonne aucune). Existe pour que
  # `zcrud_chat`/`zcrud_chat_kernel` n'aient JAMAIS à dépendre de
  # `zcrud_flashcard` (DODLP/DLCFTI porteraient le domaine d'étude sans usage).
  # Arêtes SORTANTES : core + chat_kernel + flashcard + study_kernel + study.
  # ACYCLIQUE ; CORE OUT=0 ; PUITS du graphe (aucune arête entrante).
  - packages/zcrud_chat_study
  # ES-4.2 : runtime de session SRS en CYCLE (`ZStudySessionEngine` :
  # ChangeNotifier pur + reducer PUR, réinsertion +2/+4 sur lapse). Écrit le SRS
  # UNIQUEMENT via un seam injecté (= `reviewCard`, voie unique AD-9/AD-23) —
  # aucun `ZSrsScheduler`/`ZRepetitionStore` en champ. Dépend de zcrud_core +
  # zcrud_flashcard + zcrud_study_kernel (arêtes SORTANTES seules ; ACYCLIQUE ;
  # CORE OUT=0). Package Flutter (ChangeNotifier) → `flutter test`.
  - packages/zcrud_session
  # ES-5.1 : orchestration « study tools » (PRÉSENTATION, AD-25). Socle de
  # décomposabilité (`ZStudyToolsSectionSpec` + `ZSectionedStudyLayout` +
  # harnais golden discriminant). Dépend de zcrud_core + zcrud_study_kernel +
  # zcrud_annotations (ACYCLIQUE ; CORE OUT=0 ; jamais l'inverse). Package
  # Flutter → `flutter test` (golden).
  - packages/zcrud_study
  # EX-UI.1 : infrastructure UI responsive TRANSVERSE. Pose ZWindowSizeClass
  # (enum M3, 600/840) + ZBreakpointValue<T> (générique, cascade). Dépend
  # UNIQUEMENT de zcrud_core et RÉUTILISE ses breakpoints (ZBreakpoint /
  # ZResponsiveBreakpoints), jamais redéclarés — AD-29 amendé (réconciliation
  # E3-4, Option A). Arête SORTANTE vers le cœur (entrante au cœur) : CORE OUT=0
  # intact ; ACYCLIQUE.
  # AD-57 — satellites OPT-IN adosses a un paquet de l'ecosysteme pub.dev, chacun
  # derriere une abstraction du coeur et avec un repli zero-dependance ailleurs.
  # `zcrud_reorder` : backend de ZReorderRenderer (reordonnancement INTERNE).
  # `zcrud_dnd` : drag-and-drop NATIF (fichiers de l'OS, echange inter-apps) —
  # capacite DISTINCTE, isolee car elle impose une chaine de build native.
  - packages/zcrud_reorder
  - packages/zcrud_dnd
  - packages/zcrud_responsive
  # EX-UI.5 : navigation UI transverse. Pose le maillon AD-30 —
  # ZEditionPresentation (enum { page, sheet, dialog }) + ZFormWeight (enum) +
  # ZPresentationPolicy (dérive PUREMENT le mode d'un ZWindowSizeClass, injectable,
  # non-sealed). Dépend de zcrud_core + zcrud_responsive (arêtes SORTANTES) :
  # CORE OUT=0 intact ; ACYCLIQUE. Le port ZFormPresenter/ZAdaptivePresenter = EX-UI.6.
  - packages/zcrud_navigation
  # EX-UI.7 : kit de widgets UI transverses (AD-32). Tête de série du package —
  # pose ZContentState (enum { idle, loading, empty, error, success }) +
  # ZEmptyState/ZLoadingState/ZErrorState + aiguilleur ZContentStateView +
  # ZConfirmTone (enum { neutral, destructive }) + ZConfirmDialog /
  # showZConfirmDialog (dark-mode-aware, sans gestionnaire d'état). Dépend
  # UNIQUEMENT de zcrud_core et CONSOMME ses seams (ZcrudScope/ZcrudTheme/
  # ZcrudLocalizations), jamais redéclarés. Arête SORTANTE vers le cœur (entrante
  # au cœur) : CORE OUT=0 intact ; ACYCLIQUE.
  - packages/zcrud_ui_kit
  - packages/zcrud_generator
  - packages/zcrud_markdown
  - packages/zcrud_list
  - packages/zcrud_mindmap
  - packages/zcrud_flashcard
  - packages/zcrud_firestore
  - packages/zcrud_geo
  - packages/zcrud_intl
  - packages/zcrud_export
  # CR-LEX-40 : export PDF SEUL (sans arete tableur) —  en depend
  # et le re-exporte, donc aucune surface publique ne change.
  - packages/zcrud_export_pdf
  # su-11 : satellite PLATEFORME d'export (AD-42). Garde `zcrud_export` PUR en
  # accueillant l'impl concrète du rasteriseur LaTeX (`flutter_math_fork`) et la
  # preview/impression/partage (`printing`). LEAF : personne n'en dépend ;
  # arêtes SORTANTES zcrud_* = zcrud_export + zcrud_core UNIQUEMENT (AD-1).
  - packages/zcrud_export_ui
  # ── fp-1-2 (epic E-FORM-PARITY) : SUBSTRAT satellites de parité + vendor ──────
  # Squelettes de substrat (coquilles conformes, gardées, résolues offline) posés
  # AVANT les adaptateurs de parité. Chacun n'a qu'UNE arête `zcrud_*` sortante :
  # zcrud_core (AD-1, CORE OUT=0 intact, ACYCLIQUE). Adaptateurs à venir :
  # zcrud_select→fp-4-1 (AD-48), zcrud_media→fp-4-2 (AD-51), zcrud_html→fp-4-3
  # (AD-50), zcrud_field_extras→Finitions (AD-53).
  - packages/zcrud_select
  - packages/zcrud_html
  - packages/zcrud_media
  - packages/zcrud_field_extras
  # AD-49 RÉVISÉ (2026-07-20) — `awesome_select` n'est PLUS un membre vendorisé
  # du workspace. Le vendoring rendait `zcrud_select` inconsommable de
  # l'extérieur : la contrainte hosted `^6.0.0` résolvait, chez une app tierce,
  # vers la 6.0.0 de pub.dev — figée en Dart 2 (`sdk: <3.0.0`) — et faisait
  # ÉCHOUER son `pub get`. Le fork (correctifs Dart 3 / Flutter M3 + bug amont
  # `task = task`) est désormais publié sous
  # https://github.com/zakarius-dev/awesome_select (MIT, © Akbar Pulatov) et
  # référencé en dépendance git `ref: v6.1.0` par le SEUL `zcrud_select`.
  # Monorepo et apps consommatrices résolvent ainsi EXACTEMENT le même code.
  # Confinement toujours gardé par
  # packages/zcrud_select/test/z_select_confinement_test.dart.
  # CHAT-4 : couture de MENU contextuel (`ZMenuRenderer`) — le déclencheur ET le
  # contenu sont découplés du socle ; repli SDK zéro-dépendance (AD-57).
  # Foyer NEUTRE et ATTEIGNABLE que `ZItemActionsMenu` (`zcrud_study`, satellite
  # MÉTIER) ne pouvait pas être : `zcrud_chat` ne peut pas dépendre du domaine
  # d'étude, et `zcrud_core` ne peut dépendre d'aucun satellite (CORE OUT=0 —
  # cf. la duplication déjà ASSUMÉE dans `z_batch_action.dart`).
  # Dépend UNIQUEMENT de zcrud_core (arête SORTANTE seule) ; ACYCLIQUE ;
  # CORE OUT=0 ; aucune arête entrante (PUITS du graphe) ; aucune dép. TIERCE.
  - packages/zcrud_menu
  - packages/zcrud_riverpod
  - packages/zcrud_get
  - packages/zcrud_provider
  # Harnais de parité E2-9 : dev/test-only, HORS du glob melos `packages/**`
  # (donc `melos list` reste 15) mais membre du workspace pour une résolution
  # partagée propre. Nom sans préfixe `zcrud_` → invisible pour graph_proof.py
  # (CORE OUT=0 / ACYCLIQUE inchangés). Référencé en dev_dependency des 3 bindings.
  - tool/binding_conformance
  # Harnais du gate AD-19.1 (ES-1.4) : dev/test-only, HORS du glob melos
  # `packages/**` (`melos list` reste 15). PUITS du graphe (aucun `zcrud_*` ne
  # dépend de lui) → zéro arête entrante, aucun cycle possible par construction.
  # Exécuté par scripts/ci/gate_reserved_keys.dart, PAS par `melos run test`
  # (cf. `melos.ignore` ci-dessous).
  - tool/reserved_keys_gate

dev_dependencies:
  melos: ^8.0.0
  # Baseline de lint pur-Dart partagée (analysis_options.yaml racine). Déclarée
  # une seule fois au root (package_config partagé sous pub workspaces) =>
  # `package:lints/recommended.yaml` résolvable depuis chaque membre pur-Dart.
  lints: ^6.0.0
  # Résolution garantie de `package:yaml` pour le gate M-1 (scripts/ci/gate_melos_divergence.dart).
  yaml: ^3.1.2
  # ES-1.4 (H1) : `scripts/ci/gate_reserved_keys.dart` PARSE le Dart (AST) au lieu
  # de le « grepper ». Une regex ligne-à-ligne était aveugle aux en-têtes enroulées
  # par `dart format` et aux modificateurs Dart 3 (`final`/`base`/`sealed`/
  # `interface class`) : une entité `ZExtensible` non sondée traversait le gate.
  # Dépendance de SCRIPT (root, dev-only) — AD-1 intact : aucun package `zcrud_*`
  # ne gagne `analyzer` (il reste confiné à `zcrud_generator`, seul autorisé).
  analyzer: ^12.0.0

# Configuration melos (melos >= 6 / pub workspaces la lit depuis le root
# pubspec.yaml). ⚠️ CE BLOC EST LA SOURCE DE VÉRITÉ DES SCRIPTS melos : le
# `melos.yaml` racine en contient une copie identique (conservée pour AC 3)
# qui est IGNORÉE par melos sous pub workspaces. Toute évolution de script se
# fait ICI en priorité. Garde-fou CI anti-divergence => gate M-1 (gate:melos).
# ⚠️ M-1 : ce bloc `scripts:` DOIT rester identique à celui de `melos.yaml`
# (le gate `gate:melos` échoue sinon).
melos:
  name: zcrud
  # E2-9 / ES-1.4 : exclut les harnais dev/test-only `binding_conformance` et
  # `reserved_keys_gate` (membres du workspace pub pour une résolution partagée
  # propre, mais NON produits) de la VUE melos → `melos list` reste 15 (invariant
  # produit). N'affecte PAS les scripts (gate M-1 ne compare que le bloc `scripts:`).
  # ⚠️ Corollaire : `melos run test` NE LANCE PAS leurs tests — `gate:reserved-keys`
  # exécute donc EXPLICITEMENT `flutter test --tags reserved-keys` dans le harnais.
  ignore:
    - binding_conformance
    - reserved_keys_gate
  scripts:
    generate:
      description: Régénère le code (build_runner) sur chaque package annoté (no-op propre si aucun).
      run: melos exec --depends-on build_runner -- dart run build_runner build --delete-conflicting-outputs
    analyze:packages:
      description: Analyse statique de tous les packages (melos exec, par package).
      exec: dart analyze .
    analyze:scripts:
      description: "Analyse statique des cibles HORS VUE MELOS : `scripts/`, `tool/compat_check` (hors workspace) ET `tool/binding_conformance`/`tool/reserved_keys_gate` (membres du `workspace:` MAIS listés dans `melos.ignore:`, donc jamais atteints par `melos exec`). MESURÉ : une erreur de type injectée dans reserved_keys_gate laissait `melos run analyze` VERT."
      run: dart analyze scripts tool/compat_check tool/binding_conformance tool/reserved_keys_gate
    analyze:example:
      description: "Analyse statique d'`example/` — HORS du bloc `workspace:` (frontière EX-1), donc invisible de `melos exec` (`melos list` ne le renvoie pas) et donc d'`analyze:packages`. 3e occurrence de la MÊME classe d'angle mort (après ZExportApi en E11a-3 et les scripts de gate) : une erreur d'analyse y a survécu depuis 1e4ba5e sous un `melos analyze` VERT (AI-SUF-1)."
      run: dart analyze example
    analyze:
      description: "Analyse statique COMPLÈTE : packages (melos exec) PUIS scripts de gate PUIS example. Point d'entrée quotidien — doit couvrir tout ce que `verify` exécute, Y COMPRIS ce que `melos list` ne voit pas."
      run: melos run analyze:packages && melos run analyze:scripts && melos run analyze:example
    test:dart:
      description: Tests des packages PUR-DART (dart test ; exclut les packages Flutter).
      run: melos exec --no-flutter --dir-exists test -- dart test
    test:flutter:
      description: Tests des packages FLUTTER (flutter test ; ex. zcrud_core depuis E2-7).
      run: melos exec --flutter --dir-exists test -- flutter test
    test:js:
      description: "Gate ES-1.2/M1 : rejoue la suite pur-Dart de zcrud_study_kernel sur plateforme JS (dart test -p node) — prouve le déterminisme web de zFnv1a32. SKIP bruyant (RC=0) si Node est absent."
      run: dart run scripts/ci/gate_web_determinism.dart
    test:
      description: Agrège les tests pur-Dart puis Flutter (route zcrud_core vers flutter test).
      run: melos run test:dart && melos run test:flutter
    gate:graph:
      description: "Gate AD-1 : acyclicité du graphe de dépendances (deps + dev + overrides)."
      run: python3 scripts/dev/graph_proof.py
    gate:melos:
      description: "Gate M-1 : anti-divergence des blocs scripts melos (pubspec vs melos.yaml)."
      run: dart run scripts/ci/gate_melos_divergence.dart
    gate:analyze-coverage:
      description: "Gate : aucun répertoire avec pubspec.yaml hors workspace ne peut échapper à l'analyse."
      run: dart run scripts/ci/gate_analyze_coverage.dart
    gate:reflectable:
      description: "Gate AD-3 : interdiction de reflectable dans le moteur (hors ReflectableCodec)."
      run: dart run scripts/ci/gate_reflectable.dart
    gate:secrets:
      description: "Gate AD-12 : scan de secrets committés (repli local)."
      run: dart run scripts/ci/gate_secret_scan.dart
    gate:codegen:
      description: "Gate AD-3 : aucun modèle annoté sans .g.dart généré."
      run: dart run scripts/ci/gate_codegen.dart
    gate:codegen-distribution:
      description: "Gate ES-1/D1 : distribution git du code généré — tout `part` d'un `lib/` de packages/* doit désigner un fichier NON gitignoré (sinon un consommateur en dépendance git obtient un package sans son code généré). PRÉSUPPOSE rien (verdict par règles `git check-ignore --no-index`)."
      run: dart run scripts/ci/gate_codegen_distribution.dart
    gate:compat:
      description: "Gate FR-25 (E1-4) : dry-run de compat de résolution (flutter_quill+awesome_select+analyzer) dans tool/compat_check. Exige la toolchain Flutter."
      run: dart run scripts/ci/gate_compat_resolution.dart
    gate:reserved-keys:
      description: "Gate AD-19.1 (ES-1.4) : clés de sync réservées — volet (A) comportemental (tool/reserved_keys_gate) + volet (B) syntaxique + contrôle de couverture. PRÉSUPPOSE le codegen (lit les *.g.dart)."
      run: dart run scripts/ci/gate_reserved_keys.dart
    verify:serialization:
      description: "Slot E2-10/ES-3.5 (AD-10) : rétro-compat de sérialisation. SKIP BRUYANT tant qu'aucun test taggé `serialization-compat` n'existe ; ZCRUD_REQUIRE_SERIALIZATION_COMPAT=1 le transforme en ÉCHEC."
      run: dart run scripts/ci/verify_serialization.dart
    verify:
      description: "Enchaîne tous les gates de merge localement — MIROIR EXACT de la CI (.github/workflows/ci.yml exécute ce script en STEP UNIQUE : tout gate ajouté ici est en CI par construction)."
      run: |
        melos run analyze:scripts && \
        dart run scripts/ci/gate_analyze_coverage.dart && \
        python3 scripts/dev/graph_proof.py && \
        dart run scripts/ci/gate_melos_divergence.dart && \
        dart run scripts/ci/gate_reflectable.dart && \
        dart run scripts/ci/gate_secret_scan.dart && \
        dart run scripts/ci/gate_codegen.dart && \
        dart run scripts/ci/gate_codegen_distribution.dart && \
        dart run scripts/ci/gate_compat_resolution.dart && \
        dart run scripts/ci/gate_consumption_recipe.dart && \
        dart run scripts/ci/gate_web_determinism.dart && \
        dart run scripts/ci/gate_reserved_keys.dart && \
        ZCRUD_REQUIRE_SERIALIZATION_COMPAT=1 dart run scripts/ci/verify_serialization.dart

# Configuration melos du monorepo zcrud (melos ^7.0.0 — pub workspaces).
# `melos bootstrap` délègue à `dart pub get` racine sous resolution: workspace.
# Le `packages:` en glob sert le ciblage des scripts (melos run / melos exec) ;
# le bloc `workspace:` du root pubspec.yaml reste la source de vérité de la résolution.
name: zcrud

packages:
  - packages/**

# E2-9 / ES-1.4 : les harnais dev/test-only `binding_conformance` et
# `reserved_keys_gate` (tool/, membres du workspace pub) sont EXCLUS de la vue
# melos → `melos list` reste 15 (invariant produit). ⚠️ Sous pub workspaces,
# melos dérive ses packages du bloc `workspace:` du root pubspec.yaml ET applique
# cet `ignore`. Miroir du bloc `melos.ignore` de pubspec.yaml (source de vérité).
# ⚠️ Corollaire : `melos run test` NE LANCE PAS leurs tests — `gate:reserved-keys`
# exécute donc EXPLICITEMENT `flutter test --tags reserved-keys` dans le harnais.
ignore:
  - binding_conformance
  - reserved_keys_gate

# ⚠️ SOURCE DE VÉRITÉ DES SCRIPTS = root `pubspec.yaml` (bloc `melos:`).
# Sous melos >= 7 + pub workspaces, melos lit ses scripts depuis `pubspec.yaml`
# et IGNORE le bloc `scripts:` ci-dessous. Il est conservé identique pour
# lisibilité/compatibilité (AC 3) : toute modification de script DOIT être
# répliquée dans `pubspec.yaml`, sinon elle est silencieusement sans effet.
# ⚠️ M-1 : ce bloc DOIT rester identique au `melos.scripts` de `pubspec.yaml`.
# Le gate CI `gate:melos` (scripts/ci/gate_melos_divergence.dart) échoue sinon.
scripts:
  generate:
    description: Régénère le code (build_runner) sur chaque package annoté (no-op propre si aucun).
    run: melos exec --depends-on build_runner -- dart run build_runner build --delete-conflicting-outputs

  analyze:packages:
    description: Analyse statique de tous les packages (melos exec, par package).
    exec: dart analyze .

  analyze:scripts:
    description: "Analyse statique des cibles HORS VUE MELOS : `scripts/`, `tool/compat_check` (hors workspace) ET `tool/binding_conformance`/`tool/reserved_keys_gate` (membres du `workspace:` MAIS listés dans `melos.ignore:`, donc jamais atteints par `melos exec`). MESURÉ : une erreur de type injectée dans reserved_keys_gate laissait `melos run analyze` VERT."
    run: dart analyze scripts tool/compat_check tool/binding_conformance tool/reserved_keys_gate
  analyze:example:
    description: "Analyse statique d'`example/` — HORS du bloc `workspace:` (frontière EX-1), donc invisible de `melos exec` (`melos list` ne le renvoie pas) et donc d'`analyze:packages`. 3e occurrence de la MÊME classe d'angle mort (après ZExportApi en E11a-3 et les scripts de gate) : une erreur d'analyse y a survécu depuis 1e4ba5e sous un `melos analyze` VERT (AI-SUF-1)."
    run: dart analyze example

  analyze:
    description: "Analyse statique COMPLÈTE : packages (melos exec) PUIS scripts de gate PUIS example. Point d'entrée quotidien — doit couvrir tout ce que `verify` exécute, Y COMPRIS ce que `melos list` ne voit pas."
    run: melos run analyze:packages && melos run analyze:scripts && melos run analyze:example

  test:dart:
    description: Tests des packages PUR-DART (dart test ; exclut les packages Flutter).
    run: melos exec --no-flutter --dir-exists test -- dart test

  test:flutter:
    description: Tests des packages FLUTTER (flutter test ; ex. zcrud_core depuis E2-7).
    run: melos exec --flutter --dir-exists test -- flutter test

  test:js:
    description: "Gate ES-1.2/M1 : rejoue la suite pur-Dart de zcrud_study_kernel sur plateforme JS (dart test -p node) — prouve le déterminisme web de zFnv1a32. SKIP bruyant (RC=0) si Node est absent."
    run: dart run scripts/ci/gate_web_determinism.dart

  test:
    description: Agrège les tests pur-Dart puis Flutter (route zcrud_core vers flutter test).
    run: melos run test:dart && melos run test:flutter

  gate:graph:
    description: "Gate AD-1 : acyclicité du graphe de dépendances (deps + dev + overrides)."
    run: python3 scripts/dev/graph_proof.py

  gate:melos:
    description: "Gate M-1 : anti-divergence des blocs scripts melos (pubspec vs melos.yaml)."
    run: dart run scripts/ci/gate_melos_divergence.dart

  gate:analyze-coverage:
    description: "Gate : aucun répertoire avec pubspec.yaml hors workspace ne peut échapper à l'analyse."
    run: dart run scripts/ci/gate_analyze_coverage.dart

  gate:reflectable:
    description: "Gate AD-3 : interdiction de reflectable dans le moteur (hors ReflectableCodec)."
    run: dart run scripts/ci/gate_reflectable.dart

  gate:secrets:
    description: "Gate AD-12 : scan de secrets committés (repli local)."
    run: dart run scripts/ci/gate_secret_scan.dart

  gate:codegen:
    description: "Gate AD-3 : aucun modèle annoté sans .g.dart généré."
    run: dart run scripts/ci/gate_codegen.dart

  gate:codegen-distribution:
    description: "Gate ES-1/D1 : distribution git du code généré — tout `part` d'un `lib/` de packages/* doit désigner un fichier NON gitignoré (sinon un consommateur en dépendance git obtient un package sans son code généré). PRÉSUPPOSE rien (verdict par règles `git check-ignore --no-index`)."
    run: dart run scripts/ci/gate_codegen_distribution.dart

  gate:compat:
    description: "Gate FR-25 (E1-4) : dry-run de compat de résolution (flutter_quill+awesome_select+analyzer) dans tool/compat_check. Exige la toolchain Flutter."
    run: dart run scripts/ci/gate_compat_resolution.dart

  gate:reserved-keys:
    description: "Gate AD-19.1 (ES-1.4) : clés de sync réservées — volet (A) comportemental (tool/reserved_keys_gate) + volet (B) syntaxique + contrôle de couverture. PRÉSUPPOSE le codegen (lit les *.g.dart)."
    run: dart run scripts/ci/gate_reserved_keys.dart

  verify:serialization:
    description: "Slot E2-10/ES-3.5 (AD-10) : rétro-compat de sérialisation. SKIP BRUYANT tant qu'aucun test taggé `serialization-compat` n'existe ; ZCRUD_REQUIRE_SERIALIZATION_COMPAT=1 le transforme en ÉCHEC."
    run: dart run scripts/ci/verify_serialization.dart

  verify:
    description: "Enchaîne tous les gates de merge localement — MIROIR EXACT de la CI (.github/workflows/ci.yml exécute ce script en STEP UNIQUE : tout gate ajouté ici est en CI par construction)."
    run: |
      melos run analyze:scripts && \
      dart run scripts/ci/gate_analyze_coverage.dart && \
      python3 scripts/dev/graph_proof.py && \
      dart run scripts/ci/gate_melos_divergence.dart && \
      dart run scripts/ci/gate_reflectable.dart && \
      dart run scripts/ci/gate_secret_scan.dart && \
      dart run scripts/ci/gate_codegen.dart && \
      dart run scripts/ci/gate_codegen_distribution.dart && \
      dart run scripts/ci/gate_compat_resolution.dart && \
      dart run scripts/ci/gate_consumption_recipe.dart && \
      dart run scripts/ci/gate_web_determinism.dart && \
      dart run scripts/ci/gate_reserved_keys.dart && \
      ZCRUD_REQUIRE_SERIALIZATION_COMPAT=1 dart run scripts/ci/verify_serialization.dart

  doc:api:
    description: "Référence d'API : `dart doc` sur chaque paquet, assemblée sous `website/static/api/<pkg>/` (servie en /api par le site). Artefacts gitignorés — régénérés avant chaque publication."
    run: dart run scripts/doc/build_api_docs.dart

  doc:site:
    description: "Construit le site Docusaurus (`website/`) après avoir régénéré la référence d'API. Exige Node ; n'est PAS un gate de merge."
    run: melos run doc:api && dart run scripts/doc/build_site.dart

  doc:deploy:
    description: "Publie le site construit sur la branche `gh-pages` depuis le poste (aucun GitHub Actions requis — la CI est à l'arrêt). Refuse de publier un arbre sale ou une build absente."
    run: dart run scripts/doc/deploy_site.dart

  doc:diff-gate:
    description: "Gate DOC-1 (chantier documentation) : le diff courant vs HEAD (ou <ref>/ZCRUD_DOC_BASE) se réduit à des commentaires et des fichiers documentaires — tout .dart de lib comparé APRÈS strip, .dart hors lib interdit, non-Dart sur liste blanche."
    run: dart run scripts/ci/doc_only_diff.dart

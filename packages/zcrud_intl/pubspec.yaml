# zcrud_intl — membre du workspace zcrud (resolution: workspace).
# E11a-2 : `zcrud_intl` devient un package FLUTTER (champs téléphone/pays/adresse
# servis via `ZWidgetRegistry`, patron AD-2) et acquiert la SEULE arête vers une
# lib téléphone du graphe : `phone_numbers_parser` (pur-Dart, métadonnées
# bundlées, SANS clé API ni réseau — AD-12).
# AD-1/AD-12 : cette lib vit EXCLUSIVEMENT ici (jamais dans `zcrud_core`) et est
# CONFINÉE à l'unique pont `src/presentation/z_phone_codec.dart`. Aucun type lib
# (`PhoneNumber`/`IsoCode`) ne fuit ni dans `zcrud_core`, ni dans la valeur de
# tranche, ni dans l'API publique du barrel. Le catalogue pays est un asset JSON
# bundlé (`lib/assets/countries.json`), chargé paresseusement. ZÉRO clé/secret.
# AD-1 : arête sortante zcrud_* = zcrud_core UNIQUEMENT (graphe acyclique).
name: zcrud_intl
description: "International fields for zcrud: phone, country and address with bundled, offline metadata and neutral values."
version: 3.27.0
publish_to: none
resolution: workspace

homepage: https://github.com/zakarius-dev/zcrud
repository: https://github.com/zakarius-dev/zcrud/tree/main/packages/zcrud_intl
issue_tracker: https://github.com/zakarius-dev/zcrud/issues
topics:
  - internationalization
  - phone
  - country
  - forms

environment:
  sdk: ^3.12.2

# Arêtes inter-packages zcrud_* (AD-1, graphe acyclique) : zcrud_core UNIQUEMENT.
# Siblings du workspace résolus par contrainte de version (pas de path:).
dependencies:
  flutter:
    sdk: flutter
  # Lib téléphone pur-Dart (parse/valide/formate E.164), métadonnées bundlées,
  # SANS clé API ni réseau (AD-12). SEULE arête téléphone du graphe (AD-1),
  # confinée à `src/presentation/z_phone_codec.dart`.
  phone_numbers_parser: ^9.0.23
  # CR-DODLP-PHONE-NATIF (2026-08-10) : RENDU du champ `phoneNumber` servi par le
  # paquet de référence du legacy DODLP (sélecteur pays drapeau/indicatif +
  # recherche, format-as-you-type libphonenumber). Ajoutée ICI et NULLE PART
  # AILLEURS (AD-1) : l'hôte tire le rendu en important `zcrud_intl` seul, sans
  # jamais déclarer ce paquet — exactement le patron `flutter_quill` ⊂
  # `zcrud_markdown`. CONFINÉE à l'unique pont
  # `src/presentation/z_intl_phone_input_bridge.dart` (garde de confinement dans
  # `isolation_gates_test.dart`, symétrique de celle de `phone_numbers_parser`) :
  # aucun type du paquet (`PhoneNumber`, `SelectorConfig`,
  # `PhoneInputSelectorType`, `Country`) ne franchit cette frontière, ni au
  # barrel, ni dans une signature publique, ni dans la valeur de tranche
  # (désormais une `String` internationale neutre).
  # AD-12 : métadonnées + drapeaux BUNDLÉS dans le paquet, ZÉRO réseau, ZÉRO clé.
  intl_phone_number_input: ^0.7.5
  # CR-DODLP-GAP3BIS : SEULE arête `intl` du graphe (AD-1). Elle sert
  # EXCLUSIVEMENT l'impl du port `ZDateDisplayFormatter` de `zcrud_core`
  # (`src/presentation/z_intl_date_formatter.dart`) : les noms de mois/jours et
  # l'ordre des composantes sont des DONNÉES DE LOCALE (CLDR), jamais des
  # littéraux de ce paquet (FR-26). `zcrud_core` reste interdit d'`intl`
  # (garde `isolation_gates_test.dart`, inchangée) ; la lib est CONFINÉE à
  # l'unique pont ci-dessus et aucun type `intl` ne fuit dans le barrel.
  # Version alignée sur celle que `flutter_localizations` épingle déjà (0.20.2) :
  # aucune résolution nouvelle n'est introduite dans le workspace.
  intl: ^0.20.2
  zcrud_core: ^3.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Catalogues bundlés (FR-21) — chargés paresseusement via rootBundle, offline,
  # SANS clé/secret/réseau (AD-12). Devise = ISO 4217 ; subdivisions = ISO 3166-2
  # (sous-ensemble curaté indexé par pays, injectable/extensible).
  assets:
    - lib/assets/countries.json
    - lib/assets/currencies.json
    - lib/assets/subdivisions.json
